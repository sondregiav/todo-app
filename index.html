<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My todo app</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>My todos</h1>

      <p id="active-count" class="active-count" aria-live="polite">
      </p>
      <form>
        <label for="addTask">New Todo:</label>
        <input type="text" id="addTask" name="todo" placeholder="Enter a new todo" required>
        <button type="submit">Add Todo</button>
      </form>

      <div id="filters" role="group" aria-label="Filter todos">
        <button type="button" id="filter-all" aria-pressed="true">All</button>
        <button type="button" id="filter-active" aria-pressed="false">Active</button>
        <button type="button" id="filter-completed" aria-pressed="false">Completed</button>
      </div>

      <ul id="todo-list">
      </ul>
    </main>
    <script src="script.js"></script>
  </body>
</html>
